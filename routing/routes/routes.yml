---

# Entity Configuration endpoint.
# Accessible at: /simplesaml/module.php/oidanchor/.well-known/openid-federation
oidanchor-openid-federation:
  path: /.well-known/openid-federation
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\OpenIDFederation::entityConfiguration'
  }
  methods: [GET]

# Subordinate Listing endpoint (federation_list_endpoint).
# Accessible at: /simplesaml/module.php/oidanchor/federation/list
oidanchor-federation-list:
  path: /federation/list
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\OpenIDFederation::subordinateList'
  }
  methods: [GET]

# Subordinate Statement endpoint (federation_fetch_endpoint).
# Accessible at: /simplesaml/module.php/oidanchor/federation/fetch?iss=<TA>&sub=<entity>
oidanchor-federation-fetch:
  path: /federation/fetch
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\OpenIDFederation::fetch'
  }
  methods: [GET]

# ============================================================
# Admin UI routes (require admin session)
# ============================================================

# List all subordinates.
# Accessible at: /simplesaml/module.php/oidanchor/admin/subordinates
oidanchor-admin-subordinates-list:
  path: /admin/subordinates
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminSubordinates::list'
  }
  methods: [GET]

# Register a new subordinate (GET = form, POST = submit).
oidanchor-admin-subordinates-create:
  path: /admin/subordinates/create
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminSubordinates::create'
  }
  methods: [GET, POST]

# Edit an existing subordinate. {entityId} is the URL-encoded entity ID.
oidanchor-admin-subordinates-edit:
  path: /admin/subordinates/{entityId}/edit
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminSubordinates::edit'
  }
  requirements:
    entityId: '.+'
  methods: [GET, POST]

# Delete a subordinate (POST only - triggered by form submit with confirm).
oidanchor-admin-subordinates-delete:
  path: /admin/subordinates/{entityId}/delete
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminSubordinates::delete'
  }
  requirements:
    entityId: '.+'
  methods: [POST]

# Set subordinate status (POST only). Expects ?status=active|suspended in body.
oidanchor-admin-subordinates-status:
  path: /admin/subordinates/{entityId}/status
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminSubordinates::setStatus'
  }
  requirements:
    entityId: '.+'
  methods: [POST]

# ============================================================
# Admin UI routes — federation-wide metadata policies
# ============================================================

# List all federation-wide policies.
oidanchor-admin-policies-list:
  path: /admin/policies
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminPolicies::list'
  }
  methods: [GET]

# Create a new federation-wide policy (GET = form, POST = submit).
oidanchor-admin-policies-create:
  path: /admin/policies/create
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminPolicies::create'
  }
  methods: [GET, POST]

# Edit an existing federation-wide policy. {entityType} is the URL-encoded entity type.
oidanchor-admin-policies-edit:
  path: /admin/policies/{entityType}/edit
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminPolicies::edit'
  }
  requirements:
    entityType: '.+'
  methods: [GET, POST]

# Delete a federation-wide policy (POST only).
oidanchor-admin-policies-delete:
  path: /admin/policies/{entityType}/delete
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminPolicies::delete'
  }
  requirements:
    entityType: '.+'
  methods: [POST]

# ============================================================
# Trust Mark Status endpoint (public — no admin session).
# Accessible at: /simplesaml/module.php/oidanchor/trust_mark_status
#   ?trust_mark_type=<type>&sub=<entity>   or   ?trust_mark=<compact JWT>
# ============================================================
oidanchor-trust-mark-status:
  path: /trust_mark_status
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\TrustMarkStatus::status'
  }
  methods: [GET]

# ============================================================
# Admin UI routes — Trust Mark Types catalog (require admin session)
# ============================================================

# List all Trust Mark types.
oidanchor-admin-trust-mark-types-list:
  path: /admin/trust-mark-types
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarkTypes::list'
  }
  methods: [GET]

# Create a new Trust Mark type (GET = form, POST = submit).
oidanchor-admin-trust-mark-types-create:
  path: /admin/trust-mark-types/create
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarkTypes::create'
  }
  methods: [GET, POST]

# Edit an existing Trust Mark type. {trustMarkId} is the URL-encoded type identifier.
oidanchor-admin-trust-mark-types-edit:
  path: /admin/trust-mark-types/{trustMarkId}/edit
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarkTypes::edit'
  }
  requirements:
    trustMarkId: '.+'
  methods: [GET, POST]

# Delete a Trust Mark type (POST only).
oidanchor-admin-trust-mark-types-delete:
  path: /admin/trust-mark-types/{trustMarkId}/delete
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarkTypes::delete'
  }
  requirements:
    trustMarkId: '.+'
  methods: [POST]

# ============================================================
# Admin UI routes — issued Trust Marks (require admin session)
# ============================================================

# List issued Trust Marks (supports ?trust_mark_id, ?sub, ?status filters).
oidanchor-admin-trust-marks-list:
  path: /admin/trust-marks
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarks::list'
  }
  methods: [GET]

# Issue a new Trust Mark (GET = form, POST = submit).
oidanchor-admin-trust-marks-issue:
  path: /admin/trust-marks/issue
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarks::issue'
  }
  methods: [GET, POST]

# View a single issued Trust Mark (decoded header/payload + raw JWT). {id} is the row id.
oidanchor-admin-trust-marks-view:
  path: /admin/trust-marks/{id}/view
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarks::view'
  }
  requirements:
    id: '\d+'
  methods: [GET]

# Revoke an issued Trust Mark (POST only).
oidanchor-admin-trust-marks-revoke:
  path: /admin/trust-marks/{id}/revoke
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminTrustMarks::revoke'
  }
  requirements:
    id: '\d+'
  methods: [POST]

# ============================================================
# Resolve endpoint (public — no admin session).
# Accessible at: /simplesaml/module.php/oidanchor/resolve
#   ?sub=<entity>&trust_anchor=<TA>[&type=<entity_type>]
# ============================================================
oidanchor-resolve:
  path: /resolve
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\Resolve::resolve'
  }
  methods: [GET]

# Admin Resolve Tester (require admin session). GET = form, POST = run.
oidanchor-admin-resolve:
  path: /admin/resolve
  defaults: {
    _controller: 'SimpleSAML\Module\oidanchor\Controller\AdminResolve::index'
  }
  methods: [GET, POST]

# ============================================================
# Federation Admin REST API (/api/v1/admin/...). JSON. Requires admin session.
# Implemented subset: endpoints backed by existing services (subordinates, general
# metadata policies, trust mark types, read-only keys/entity-configuration).
# NOTE: literal /subordinates/* paths are declared BEFORE /subordinates/{subordinateID}
# so the greedy {subordinateID} (.+) does not swallow them.
# ============================================================

# ---- General metadata policies (FederationPolicyRepository) ----
oidanchor-api-metadata-policy-operator:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}/{operator}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::getOperator' }
  methods: [GET]
oidanchor-api-metadata-policy-operator-put:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}/{operator}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::putOperator' }
  methods: [PUT]
oidanchor-api-metadata-policy-operator-delete:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}/{operator}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::deleteOperator' }
  methods: [DELETE]

oidanchor-api-metadata-policy-claim:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::getClaim' }
  methods: [GET]
oidanchor-api-metadata-policy-claim-put:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::putClaim' }
  methods: [PUT]
oidanchor-api-metadata-policy-claim-post:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::addOperators' }
  methods: [POST]
oidanchor-api-metadata-policy-claim-delete:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}/{claim}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::deleteClaim' }
  methods: [DELETE]

oidanchor-api-metadata-policy-type:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::getForType' }
  methods: [GET]
oidanchor-api-metadata-policy-type-put:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::putForType' }
  methods: [PUT]
oidanchor-api-metadata-policy-type-post:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::addForType' }
  methods: [POST]
oidanchor-api-metadata-policy-type-delete:
  path: /api/v1/admin/subordinates/metadata-policies/{entityType}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::deleteForType' }
  methods: [DELETE]

oidanchor-api-metadata-policies:
  path: /api/v1/admin/subordinates/metadata-policies
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::getAll' }
  methods: [GET]
oidanchor-api-metadata-policies-put:
  path: /api/v1/admin/subordinates/metadata-policies
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\MetadataPoliciesApi::replaceAll' }
  methods: [PUT]

# ---- Subordinate / EC lifetimes (read-only from config) ----
oidanchor-api-subordinates-lifetime:
  path: /api/v1/admin/subordinates/lifetime
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\EntityConfigurationApi::getSubordinateLifetime' }
  methods: [GET]

# ---- Subordinates (SubordinateService) ----
oidanchor-api-subordinates-list:
  path: /api/v1/admin/subordinates
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::list' }
  methods: [GET]
oidanchor-api-subordinates-create:
  path: /api/v1/admin/subordinates
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::create' }
  methods: [POST]

oidanchor-api-subordinate-statement:
  path: /api/v1/admin/subordinates/{subordinateID}/statement
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::statement' }
  requirements: { subordinateID: '.+' }
  methods: [GET]

oidanchor-api-subordinate-jwks:
  path: /api/v1/admin/subordinates/{subordinateID}/jwks
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::getJwks' }
  requirements: { subordinateID: '.+' }
  methods: [GET]
oidanchor-api-subordinate-jwks-put:
  path: /api/v1/admin/subordinates/{subordinateID}/jwks
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::setJwks' }
  requirements: { subordinateID: '.+' }
  methods: [PUT]
oidanchor-api-subordinate-jwks-post:
  path: /api/v1/admin/subordinates/{subordinateID}/jwks
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::addJwk' }
  requirements: { subordinateID: '.+' }
  methods: [POST]

oidanchor-api-subordinate-status:
  path: /api/v1/admin/subordinates/{subordinateID}/status
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::changeStatus' }
  requirements: { subordinateID: '.+' }
  methods: [PUT]

oidanchor-api-subordinate-get:
  path: /api/v1/admin/subordinates/{subordinateID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::get' }
  requirements: { subordinateID: '.+' }
  methods: [GET]
oidanchor-api-subordinate-put:
  path: /api/v1/admin/subordinates/{subordinateID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::update' }
  requirements: { subordinateID: '.+' }
  methods: [PUT]
oidanchor-api-subordinate-delete:
  path: /api/v1/admin/subordinates/{subordinateID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\SubordinatesApi::delete' }
  requirements: { subordinateID: '.+' }
  methods: [DELETE]

# ---- Federation trust mark types (TrustMarkTypeRepository) ----
oidanchor-api-trust-mark-types-list:
  path: /api/v1/admin/trust-marks/types
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\TrustMarkTypesApi::list' }
  methods: [GET]
oidanchor-api-trust-mark-types-create:
  path: /api/v1/admin/trust-marks/types
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\TrustMarkTypesApi::create' }
  methods: [POST]
oidanchor-api-trust-mark-type-get:
  path: /api/v1/admin/trust-marks/types/{trustMarkTypeID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\TrustMarkTypesApi::get' }
  requirements: { trustMarkTypeID: '.+' }
  methods: [GET]
oidanchor-api-trust-mark-type-put:
  path: /api/v1/admin/trust-marks/types/{trustMarkTypeID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\TrustMarkTypesApi::update' }
  requirements: { trustMarkTypeID: '.+' }
  methods: [PUT]
oidanchor-api-trust-mark-type-delete:
  path: /api/v1/admin/trust-marks/types/{trustMarkTypeID}
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\TrustMarkTypesApi::delete' }
  requirements: { trustMarkTypeID: '.+' }
  methods: [DELETE]

# ---- Keys (read-only, FederationKeyService) ----
oidanchor-api-published-jwks:
  path: /api/v1/admin/entity-configuration/jwks
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\KeysApi::publishedJwks' }
  methods: [GET]
oidanchor-api-keys-list:
  path: /api/v1/admin/entity-configuration/keys
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\KeysApi::listKeys' }
  methods: [GET]
oidanchor-api-kms-info:
  path: /api/v1/admin/kms
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\KeysApi::kmsInfo' }
  methods: [GET]

# ---- Entity configuration (read-only) ----
oidanchor-api-entity-configuration-metadata:
  path: /api/v1/admin/entity-configuration/metadata
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\EntityConfigurationApi::getMetadata' }
  methods: [GET]
oidanchor-api-entity-configuration-lifetime:
  path: /api/v1/admin/entity-configuration/lifetime
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\EntityConfigurationApi::getEntityConfigurationLifetime' }
  methods: [GET]
oidanchor-api-entity-configuration:
  path: /api/v1/admin/entity-configuration
  defaults: { _controller: 'SimpleSAML\Module\oidanchor\Controller\Api\EntityConfigurationApi::get' }
  methods: [GET]
